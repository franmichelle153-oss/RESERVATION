version: '3.8'

services:
  app:
    build: .
    container_name: rentivator_app
    restart: unless-stopped
    working_dir: /app/Rentivator
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=rentivator
      - DB_USERNAME=rentivator
      - DB_PASSWORD=secret
      - APP_ENV=production
      - APP_DEBUG=false
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - rentivator

  db:
    image: mysql:8.0
    container_name: rentivator_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: rentivator
      MYSQL_USER: rentivator
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - rentivator

volumes:
  db_data:

networks:
  rentivator:
    driver: bridge
